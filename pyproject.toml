[project]
name = "game-world-kg"
version = "0.1.0"
description = "Event-sourced local MVP for a dynamic game world knowledge graph."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "chromadb>=0.5",
    "httpx>=0.27",
    "kuzu>=0.7",
    "numpy>=1.26",
    "pydantic>=2",
    "uvicorn>=0.27",
]

[project.optional-dependencies]
test = [
    "pytest>=8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
game_world_kg = ["static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
